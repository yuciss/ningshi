<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>凝时</title>
<style>
:root {
  --bg: #f7f7f7;
  --surface: #ffffff;
  --surface-2: #ececec;
  --text: #171717;
  --text-2: #6b6b6b;
  --line: #dcdcdc;
  --line-strong: #bdbdbd;
  --line-dim: #ececec;
  --accent: #171717;
  --on-accent: #ffffff;
  --danger: #b3261e;
  --ripple: rgba(0, 0, 0, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111;
    --surface: #1c1c1c;
    --surface-2: #2a2a2a;
    --text: #ececec;
    --text-2: #9a9a9a;
    --line: #333333;
    --line-strong: #4a4a4a;
    --line-dim: #222222;
    --accent: #ececec;
    --on-accent: #111111;
    --danger: #f2b8b5;
    --ripple: rgba(255, 255, 255, .12);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  display: flex; flex-direction: column;
  font-family: system-ui, "Noto Sans CJK SC", sans-serif;
  background: var(--bg); color: var(--text);
}
header { padding: 18px 16px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
header h1 { font-size: 22px; font-weight: 600; }
header .ver { font-size: 12px; color: var(--text-2); margin-top: 2px; }
main { flex: 1; overflow-y: auto; padding: 12px 14px 88px; }
.hidden { display: none !important; }
.muted-text { color: var(--text-2); font-size: 13px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; margin-bottom: 10px; position: relative; overflow: hidden;
}
.card.managed { border-color: var(--line-strong); }
.card.unmanaged { border-color: var(--line-dim); }
.ripple {
  position: absolute; border-radius: 50%; background: var(--ripple);
  transform: scale(0); animation: ripple .45s ease-out forwards; pointer-events: none;
}
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
@keyframes cardin { from { opacity: 0; transform: translateY(8px); } }
.card.anim { animation: cardin .28s ease-out backwards; }

nav {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex;
  background: var(--surface); border-top: 1px solid var(--line);
}
nav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 0 9px; background: none; border: none; cursor: pointer;
  color: var(--text-2); font-size: 11px; transition: transform .08s, color .12s;
}
nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button.active { color: var(--accent); font-weight: 600; }
nav button:active { transform: scale(.9); }

.btn {
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  transition: transform .08s; flex-shrink: 0;
}
.btn:active { transform: scale(.94); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
input, select {
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 6px 8px; font-size: 13px;
}

.search { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; margin-bottom: 10px; }
.search input { flex: 1; border: none; background: none; outline: none; padding: 9px 0; }
.toolbar { display: flex; gap: 8px; margin-bottom: 10px; }

.app { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.app .icon { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; }
.app .info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.app .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pkg2 { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app .sub { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; color: var(--text-2); }
.app .pkg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { flex-shrink: 0; font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); }
.tag.group { color: var(--accent); border-color: var(--accent); }
.tag.blocked { color: var(--danger); border-color: var(--danger); }
.stat { flex-shrink: 0; font-size: 10px; color: var(--text-2); }

.switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; cursor: pointer; inset: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 24px; transition: .18s; }
.switch .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 2px; top: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 50%; transition: .18s; }
.switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .slider:before { transform: translateX(20px); border-color: var(--accent); }
.switch.grouped { opacity: .45; pointer-events: none; }

.subhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.subhead .back { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 4px 12px; font-size: 16px; cursor: pointer; }
.subhead h2 { font-size: 16px; font-weight: 600; }
.set-head { display: flex; align-items: center; gap: 10px; }
.set-head .icon { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; }
.set-head .info { flex: 1; min-width: 0; }
.set-head .name { font-size: 16px; font-weight: 600; word-break: break-all; }
.set-head .pkg { font-size: 12px; color: var(--text-2); word-break: break-all; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: none; }
.set-row .label { flex: 1; min-width: 0; font-size: 13px; }
.set-row .label .hint { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.win-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
.win-row input { width: 64px; text-align: center; }
.member-row { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.member-row:last-child { border-bottom: none; }
.member-row label { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
.m-icon { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0; }
.m-label { flex: 1; min-width: 0; font-size: 13px; }
.m-label .uid { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pre-block { font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 28vh; overflow: auto; color: var(--text-2); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1 id="page-title">凝时</h1>
  <div class="ver" id="page-version"></div>
</header>
<main>
  <section id="view-apps" class="view">
    <div class="search"><input type="search" placeholder="搜索应用名或包名" oninput="onSearch(this.value)"></div>
    <div class="toolbar">
      <button class="btn small" id="btn-refresh" onclick="loadApps(true)">刷新</button>
      <button class="btn small" id="btn-system" onclick="toggleSystem()">显示系统应用</button>
    </div>
    <div id="app-list"></div>
  </section>
  <section id="view-groups" class="view hidden">
    <div class="toolbar"><button class="btn small" id="btn-new-group" onclick="createGroup()">新建组</button></div>
    <div id="group-list"></div>
  </section>
  <section id="view-module" class="view hidden">
    <div id="module-settings"></div>
  </section>
  <section id="view-app-set" class="view hidden">
    <div id="app-set-content"></div>
  </section>
  <section id="view-group-set" class="view hidden">
    <div id="group-set-content"></div>
  </section>
</main>
<nav id="bottom-nav">
  <button data-view="apps">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
    <span>应用</span>
  </button>
  <button data-view="groups">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.4c2.4.2 4.2 1.9 4.7 4.6"/></svg>
    <span>组</span>
  </button>
  <button data-view="module">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2.2" fill="var(--surface)"/><circle cx="15" cy="12" r="2.2" fill="var(--surface)"/><circle cx="7" cy="18" r="2.2" fill="var(--surface)"/></svg>
    <span>模块</span>
  </button>
</nav>
<script>
'use strict';

// ---------- i18n ----------
const I18N = {
  zh: {
    apps: '应用', groups: '组', module: '模块',
    search: '搜索应用名或包名',
    refresh: '刷新', show_system: '显示系统应用', hide_system: '隐藏系统应用',
    no_apps: '无匹配应用',
    blocked: '已封禁',
    new_group: '新建组', no_groups: '暂无组',
    members: '{n} 个成员', on: '启用中', off: '已停用',
    settings: '设置',
    always_on: '总是开启',
    lock_block: '锁屏后封禁', lock_hint: '屏幕关闭时立即停止',
    add_window: '添加时间段', window_mode: '时间段策略',
    mode_block: '窗内禁止', mode_allow: '仅窗内可用',
    duration: '时长时期（分钟）', duration_hint: '0 = 不使用时长功能',
    cooldown: '冷却期（分钟）', cooldown_hint: '0 = 每日凌晨重置',
    ext_remaining: '延时时长', ext_hint: '每日上限 2 小时', min_unit: '分钟',
    scope: '计时口径', scope_fg: '前台', scope_any: '运行（含后台）',
    group_name: '组名', delete_group: '删除组', shared_pool: '共用计时池（时长）', shared_pool_hint: '切换后已计时长保留，冷却期重置',
    select_members: '选择应用', member_hint: '其他组中的应用不可选',
    language: '模块语言', lang_auto: '跟随系统',
    timezone: '时区', tz_auto: '跟随系统',
    status: 'daemon 状态', log: 'daemon 日志',
    refresh_log: '刷新日志', clear_log: '清空日志', log_cleared: '日志已清空',
    to: '至', remove: '删除', deleted: '已删除',
    unmanaged: '未管控', protected: '受保护',
    stats_used: '已用 {min} 分钟 · 拦截 {n} 次',
    stats_kills: '拦截 {n} 次',
    clear_on_boot: '重启模块自动清空日志'
  },
  en: {
    apps: 'Apps', groups: 'Groups', module: 'Module',
    search: 'Search name or package',
    refresh: 'Refresh', show_system: 'Show system apps', hide_system: 'Hide system apps',
    no_apps: 'No matching apps',
    blocked: 'Blocked',
    new_group: 'New group', no_groups: 'No groups',
    members: '{n} members', on: 'Enabled', off: 'Disabled',
    settings: 'Settings',
    always_on: 'Always on',
    lock_block: 'Block on screen lock', lock_hint: 'Block immediately when the screen turns off',
    add_window: 'Add time window', window_mode: 'Window policy',
    mode_block: 'Block in windows', mode_allow: 'Allow only in windows',
    duration: 'Usage period (min)', duration_hint: '0 = duration disabled',
    cooldown: 'Cooldown (min)', cooldown_hint: '0 = reset at midnight',
    ext_remaining: 'Extension', ext_hint: 'Max 2h per day', min_unit: 'min',
    scope: 'Counting scope', scope_fg: 'Foreground', scope_any: 'Running (incl. background)',
    group_name: 'Group name', delete_group: 'Delete group', shared_pool: 'Shared pool (usage)', shared_pool_hint: 'Usage is kept; cooldown resets on toggle',
    select_members: 'Select apps', member_hint: 'Apps in other groups cannot be selected',
    language: 'Language', lang_auto: 'Auto',
    timezone: 'Timezone', tz_auto: 'Auto',
    status: 'Daemon status', log: 'Daemon log',
    refresh_log: 'Refresh log', clear_log: 'Clear log', log_cleared: 'Log cleared',
    to: 'to', remove: 'Remove', deleted: 'Deleted',
    unmanaged: 'Not managed', protected: 'Protected',
    stats_used: 'Used {min} min, blocked {n} times',
    stats_kills: 'Blocked {n} times',
    clear_on_boot: 'Clear log on module restart'
  }
};

// ---------- helpers ----------
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isKSUWebUI() { return typeof ksu !== 'undefined'; }
function toast(msg) { try { ksu.toast(msg); } catch (e) {} }
function exec(cmd, opts) {
  opts = opts || {};
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    window[cb] = (errno, stdout, stderr) => {
      resolve({ errno, stdout: stdout || '', stderr: stderr || '' });
      try { delete window[cb]; } catch (e) {}
    };
    try { ksu.exec(cmd, JSON.stringify(opts), cb); }
    catch (e) { reject(e); try { delete window[cb]; } catch (e2) {} }
  });
}
async function readFile(path) {
  const { errno, stdout, stderr } = await exec(`[ -f "${path}" ] && cat "${path}"`);
  if (errno !== 0) throw new Error(stderr || 'cannot read ' + path);
  return stdout.trim();
}
async function writeFile(path, content) {
  const escaped = content.replace(/'/g, "'\\''");
  await exec(`echo '${escaped}' > "${path}"`);
}
function listPackages(type) {
  try { return JSON.parse(ksu.listPackages(type)); } catch (e) { return null; }
}
function getPackagesInfo(pkgs) {
  try { return JSON.parse(ksu.getPackagesInfo(JSON.stringify(pkgs))); } catch (e) { return null; }
}

// ---------- state ----------
let MODDIR = '/data/adb/modules/ningshi';
const DATADIR = '/data/adb/ningshi';
let rules = { version: 1, settings: {}, apps: {}, groups: {} };
let status = { blocked_uids: [] };
let lang = 'zh';
let showSystem = false;
let searchQuery = '';
let lastBlockedKey = '';
let currentView = 'apps';
let appInfoCache = {};
let currentAppKey = '';
let currentGroupGid = '';

// Packages that must never be manageable (blocking them would freeze the system).
// uid < 10000 is excluded separately.
const PROTECTED = ['me.weishu.kernelsu', 'com.android.systemui'];

function detectModuleDir() {
  try {
    const mi = JSON.parse(ksu.moduleInfo());
    if (mi.dir) MODDIR = mi.dir;
    else if (mi.moduleDir) MODDIR = mi.moduleDir;
    else if (mi.id) MODDIR = '/data/adb/modules/' + mi.id;
  } catch (e) {}
}

function resolveLang() {
  const s = (rules.settings && rules.settings.language) || 'auto';
  if (s === 'zh' || s === 'en') lang = s;
  else lang = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
function t(key) { return (I18N[lang] && I18N[lang][key]) || key; }
function tf(key, obj) { let s = t(key); for (const k in obj) s = s.replace('{' + k + '}', obj[k]); return s; }

function applyLanguage() {
  const title = lang === 'zh' ? '凝时' : 'Ningshi';
  document.getElementById('page-title').textContent = title;
  document.title = title;
  document.getElementById('btn-refresh').textContent = t('refresh');
  document.getElementById('btn-system').textContent = t(showSystem ? 'hide_system' : 'show_system');
  document.getElementById('btn-new-group').textContent = t('new_group');
  document.querySelector('input[type="search"]').placeholder = t('search');
  document.getElementById('bottom-nav').querySelectorAll('button').forEach(b => {
    b.querySelector('span').textContent = t(b.dataset.view);
  });
}

async function loadRules() {
  try { rules = JSON.parse(await readFile(DATADIR + '/rules.json')); }
  catch (e) { rules = { version: 1, settings: {}, apps: {}, groups: {} }; }
}
async function saveRules() {
  await writeFile(DATADIR + '/rules.json', JSON.stringify(rules, null, 2));
  await exec(MODDIR + '/bin/ningshi reload');
}

async function readModuleVersion() {
  try {
    const text = await readFile(MODDIR + '/module.prop');
    const m = text.match(/^version=(.+)$/m);
    if (m) return 'v' + m[1].trim();
  } catch (e) {}
  return '';
}

// ---------- views ----------
function showView(name) {
  currentView = name;
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById('view-' + name).classList.remove('hidden');
  const navTab = name === 'app-set' ? 'apps' : (name === 'group-set' ? 'groups' : name);
  document.querySelectorAll('#bottom-nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === navTab);
  });
  if (name === 'apps') loadApps();
  if (name === 'groups') loadGroups();
  if (name === 'module') renderModuleSettings();
}

function ripple(event, el) {
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.5;
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size + 'px';
  span.style.left = (event.clientX - rect.left - size / 2) + 'px';
  span.style.top = (event.clientY - rect.top - size / 2) + 'px';
  el.appendChild(span);
  setTimeout(() => span.remove(), 500);
}

// ---------- status / log ----------
async function fetchStatus() {
  try {
    const r = await exec(MODDIR + '/bin/ningshi status');
    status = JSON.parse(r.stdout || '{}');
  } catch (e) { status = {}; }
}

async function loadStatus() {
  await fetchStatus();
  const key = JSON.stringify(status.blocked_uids || []);
  if (key !== lastBlockedKey) {
    lastBlockedKey = key;
    if (currentView === 'apps') loadApps();
  } else if (currentView === 'apps') {
    updateStats();
  }
  const el = document.getElementById('status-pre');
  if (el) el.textContent = JSON.stringify(status, null, 2);
}

function effectiveDuration(key) {
  const ar = rules.apps[key];
  if (ar && ar.enabled && ar.duration && ar.duration.limit_minutes > 0) {
    return ar.duration;
  }
  const gid = findGroupOf(key);
  if (gid) {
    const g = rules.groups[gid];
    if (g && g.enabled && g.duration && g.duration.limit_minutes > 0) {
      return g.duration;
    }
  }
  return null;
}

function scopedUsage(uid, scope) {
  const any = (status.usage_seconds && status.usage_seconds[uid]) || 0;
  const fg = (status.usage_fg_seconds && status.usage_fg_seconds[uid]) || 0;
  if (scope === 'any') return any;
  if (scope === 'background') return Math.max(0, any - fg);
  return fg;
}

function updateStats() {
  document.querySelectorAll('[data-stat-uid]').forEach(el => {
    const uid = parseInt(el.dataset.statUid, 10);
    const key = el.dataset.statKey || '';
    const kills = (status.kill_counts && status.kill_counts[uid]) || 0;
    const d = effectiveDuration(key);
    if (d) {
      const min = Math.round(scopedUsage(uid, d.scope || 'foreground') / 60);
      el.textContent = tf('stats_used', { min, n: kills });
    } else {
      el.textContent = tf('stats_kills', { n: kills });
    }
  });
}

async function loadLog() {
  const el = document.getElementById('log-pre');
  if (!el) return;
  try { el.textContent = await readFile(MODDIR + '/ningshi.log'); }
  catch (e) { el.textContent = ''; }
}
async function clearLog() {
  await exec(MODDIR + '/bin/ningshi clear_log');
  toast(t('log_cleared'));
  await loadLog();
}

// ---------- apps view ----------
function findGroupOf(key) {
  for (const gid in (rules.groups || {})) {
    if ((rules.groups[gid].members || []).includes(key)) return gid;
  }
  return null;
}
function groupName(gid) {
  const g = (rules.groups || {})[gid];
  return (g && g.name) || 'Group';
}

async function loadApps(animate) {
  await loadRules();
  await fetchStatus(); // instant stats: read daemon state right now
  lastBlockedKey = JSON.stringify(status.blocked_uids || []);
  const pkgs = listPackages(showSystem ? 'all' : 'user') || [];
  const infos = pkgs.length ? (getPackagesInfo(pkgs) || []) : [];
  const list = document.getElementById('app-list');
  list.innerHTML = '';
  appInfoCache = {};
  const items = [];
  for (const info of infos) {
    const uid = info.uid || 0;
    if (!showSystem && uid < 10000) continue;
    const pkg = info.packageName;
    const user = Math.floor(uid / 100000);
    const key = user + ':' + pkg;
    const label = info.appLabel || pkg;
    const isSystem = uid < 10000 || PROTECTED.includes(pkg);
    const rule = rules.apps[key];
    const enabled = !!(rule && rule.enabled);
    const gid = findGroupOf(key);
    appInfoCache[key] = { label, pkg, uid };
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!label.toLowerCase().includes(q) && !pkg.toLowerCase().includes(q)) continue;
    }
    items.push({ key, pkg, label, uid, isSystem, enabled, gid });
  }
  items.sort((a, b) => {
    const ma = (a.enabled || a.gid) ? 1 : 0;
    const mb = (b.enabled || b.gid) ? 1 : 0;
    if (ma !== mb) return mb - ma;
    return a.label.localeCompare(b.label);
  });
  if (!items.length) {
    list.innerHTML = '<div class="card muted-text">' + esc(t('no_apps')) + '</div>';
    return;
  }
  let idx = 0;
  for (const it of items) {
    const blocked = (status.blocked_uids || []).includes(it.uid);
    const managed = it.enabled || it.gid;
    const row = document.createElement('div');

function onAppCard(event, card, key, isSystem) {
  ripple(event, card);
  if (isSystem) return;
  const gid = findGroupOf(key);
  if (gid) { openGroupSettings(gid); return; }
  const rule = rules.apps[key];
  if (rule && rule.enabled) { openAppSettings(key); return; }
  // switch off: click has no effect
}

async function toggleApp(key, on) {
  if (on) {
    // An app is either managed alone or by a group, never both.
    for (const gid in (rules.groups || {})) {
      const m = rules.groups[gid].members || [];
      const i = m.indexOf(key);
      if (i >= 0) m.splice(i, 1);
    }
    // Re-enabling resets all policies; always_on starts off (independent).
    rules.apps[key] = {
      enabled: true, always_on: false,
      time_windows: { mode: 'block', windows: [] },
      duration: { limit_minutes: 0, scope: 'foreground' }
    };
  } else {
    delete rules.apps[key];
  }
  await saveRules();
  await loadStatus();
}

function getAppRule(key) {
  if (!rules.apps[key]) rules.apps[key] = {};
  return rules.apps[key];
}

function hhmm(v) { return /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(v); }
async function setWindow(key, idx, field, val) {

async function doExtend(key, mins) {
  const r = await exec(MODDIR + '/bin/ningshi extension ' + key + ' ' + mins);
  if (r.stderr && r.stderr.trim()) {
    toast(r.stderr.trim());
    return;
  }
  let added = mins;
  try { added = JSON.parse(r.stdout || '{}').minutes || mins; } catch (e) {}
  toast('+' + added + ' ' + t('min_unit'));
  await loadStatus();
  updateExtDisplay();
}

function updateExtDisplay() {
  const now = Math.floor(Date.now() / 1000);
  const appEl = document.getElementById('ext-remaining-app');
  if (appEl) {
    const info = appInfoCache[currentAppKey] || {};
    if (info.uid) {
      const until = (status.extensions || {})[info.uid];
      const left = (until && until > now) ? Math.ceil((until - now) / 60) : 0;
      appEl.textContent = left + ' ' + t('min_unit');
    }
  }
  const groupEl = document.getElementById('ext-remaining-group');
  if (groupEl) {
    const until = (status.group_extensions || {})[currentGroupGid];
    const left = (until && until > now) ? Math.ceil((until - now) / 60) : 0;
    groupEl.textContent = left + ' ' + t('min_unit');
  }
}

function renderMemberList(gid) {
  const g = rules.groups[gid];
  const pkgsU = listPackages('user') || [];
  const pkgsS = listPackages('system') || [];
  const pkgs = pkgsU.concat(pkgsS.filter(p => !pkgsU.includes(p)));
  const infos = pkgs.length ? (getPackagesInfo(pkgs) || []) : [];
  const userSet = new Set(pkgsU);
  infos.sort((a, b) => {
    const ua = userSet.has(a.packageName) ? 1 : 0;
    const ub = userSet.has(b.packageName) ? 1 : 0;
    if (ua !== ub) return ub - ua;
    return (a.appLabel || a.packageName).localeCompare(b.appLabel || b.packageName);
  });
  let html = '';
  for (const info of infos) {
    const uid = info.uid || 0;
    if (uid < 10000 || PROTECTED.includes(info.packageName)) continue;
    const key = Math.floor(uid / 100000) + ':' + info.packageName;
    const label = info.appLabel || info.packageName;
    const other = findGroupOf(key);
    const inThis = (g.members || []).includes(key);
    const disabled = other && other !== gid;
    html += `<div class="member-row"><label>
      <img class="m-icon" src="ksu://icon/${esc(info.packageName)}" onerror="this.style.visibility='hidden'">
      <span class="m-label">${esc(label)}<div class="uid">${esc(info.packageName)}</div></span>
      <input type="checkbox" ${inThis ? 'checked' : ''} ${disabled ? 'disabled' : ''} onchange="toggleMember('${esc(gid)}', '${esc(key)}', this.checked)">
      ${disabled ? `<span class="tag group">${esc(groupName(other))}</span>` : ''}
    </label></div>`;
  }
  const el = document.getElementById('member-list');
  if (el) el.innerHTML = html;
}

          <option value="en"${langVal === 'en' ? ' selected' : ''}>English</option>
        </select></div>
      <div class="set-row"><div class="label">${esc(t('timezone'))}</div>
        <select onchange="setSetting('timezone', this.value)">${tzOpts}</select></div>
    </div>
    <div class="card">
      <div class="set-row"><div class="label">${esc(t('status'))}</div>
        <button class="btn small" onclick="loadStatus()">${esc(t('refresh'))}</button></div>
      <pre id="status-pre" class="pre-block"></pre>
    </div>
    <div class="card">
      <div class="set-row"><div class="label">${esc(t('log'))}</div>
        <span style="display:flex;gap:6px">
          <button class="btn small" onclick="loadLog()">${esc(t('refresh_log'))}</button>
          <button class="btn small" onclick="clearLog()">${esc(t('clear_log'))}</button>
        </span></div>
      <div class="set-row"><div class="label">${esc(t('clear_on_boot'))}</div>
        <label class="switch"><input type="checkbox" ${s.clear_log_on_boot ? 'checked' : ''} onchange="setSetting('clear_log_on_boot', this.checked)"><span class="slider"></span></label></div>
      <pre id="log-pre" class="pre-block"></pre>
    </div>`;
  const pre = document.getElementById('status-pre');
  if (pre) pre.textContent = JSON.stringify(status, null, 2);
  loadLog();
}

async function setSetting(k, v) {
  rules.settings = rules.settings || {};
  if (k === 'clear_log_on_boot') {
    rules.settings[k] = !!v;
  } else {
    rules.settings[k] = v;
  }
  await saveRules();
  if (k === 'language') {
    resolveLang();
    applyLanguage();
    renderModuleSettings();
  }
}

// ---------- init ----------
document.querySelectorAll('#bottom-nav button').forEach(b => {
  b.addEventListener('click', () => showView(b.dataset.view));
});

(async () => {
  if (!isKSUWebUI()) {
    document.getElementById('page-version').textContent = 'not in KernelSU WebUI';
    return;
  }
  detectModuleDir();
  await loadRules();
  resolveLang();
  applyLanguage();
  document.getElementById('page-version').textContent = await readModuleVersion();
  await loadApps();
  setInterval(loadStatus, 5000);
})();
</script>
</body>
</html>
